spring.application.name=incidentportal
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database: override with env vars (Docker) or put values in application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/incident_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (secret must be >= 32 chars; never commit a real one)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Allowed browser origins for CORS (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# AI features (Claude). Leave the key blank to disable them; the rest of the app works without it.
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
app.ai.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
app.ai.timeout-seconds=30

# Only emails on this domain may be registered (comma separated; blank = any domain), e.g. aurum.com
app.email.allowed-domain=${ALLOWED_EMAIL_DOMAIN:}

# First-run accounts. Blank password = account is not created.
app.seed.admin-username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin-email=${SEED_ADMIN_EMAIL:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.user-username=${SEED_USER_USERNAME:user}
app.seed.user-email=${SEED_USER_EMAIL:}
app.seed.user-password=${SEED_USER_PASSWORD:}

logging.level.com.company.incidentportal=INFO
